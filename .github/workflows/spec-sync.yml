name: Spec sync

# Every week, check whether the Orchestra API has changed in a way the provider
# has to answer, and open one pull request saying so.
#
# It never merges. A refresh that changes nothing the provider models opens
# nothing at all. One that does gets the drift report as the pull request body:
# what needs attention, what is worth a look, and what `make openapi` already
# handled. The judgement itself is .claude/skills/spec-sync; this workflow only
# makes sure someone is asked.
#
# A failure here is a finding too. The docs site once split openapi.yaml into
# three files, which turned this download into a 404, so every step fails loudly
# rather than reporting "no changes".

on:
  schedule:
    # Mondays, off the hour: scheduled runs on the hour are the ones GitHub drops.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start the test workflow on the branch. A pull request opened with the
  # default token does not trigger pull_request workflows, but a dispatch does.
  actions: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

env:
  BRANCH: spec-sync/latest
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch the live specs
        run: |
          mkdir -p .tmp-spec
          for spec in engine agents admin; do
            curl --fail --silent --show-error --location --max-time 60 \
              --output ".tmp-spec/${spec}.yaml" "https://docs.getorchestra.io/api/${spec}.yaml"
          done

      - name: Compare with the committed specs
        id: drift
        run: |
          # Build the tool: `go run` reports every non-zero exit as 1, which
          # would make a dead spec URL (status 2) look like drift.
          go build -o .tmp-spec/specdrift ./tools/specdrift

          set +e
          .tmp-spec/specdrift -exit-code \
            -old openapi.yaml -new .tmp-spec/engine.yaml \
            -compare agents=openapi-agents.yaml,.tmp-spec/agents.yaml -also admin=.tmp-spec/admin.yaml \
            > .tmp-spec/report.md
          status=$?
          set -e

          cat .tmp-spec/report.md >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "outcome=clean" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=attention" >> "$GITHUB_OUTPUT" ;;
            3) echo "outcome=routine" >> "$GITHUB_OUTPUT" ;;
            *) echo "specdrift failed with status ${status}" >&2; exit 1 ;;
          esac

      - name: Open or update the pull request
        if: steps.drift.outputs.outcome != 'clean'
        env:
          OUTCOME: ${{ steps.drift.outputs.outcome }}
        run: |
          set -euo pipefail

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          # Someone may already be working on the open pull request. Rebuilding
          # the branch would erase their commits, so hand them the new report
          # as a comment and leave the branch alone.
          git fetch --quiet origin "$BRANCH" 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/${BRANCH}" > /dev/null; then
            author=$(git log -1 --format=%an "origin/${BRANCH}")
            if [ "$author" != "github-actions[bot]" ]; then
              echo "::notice::${BRANCH} has commits from ${author}; leaving it alone"
              if [ -n "$number" ]; then
                gh pr comment "$number" --body-file .tmp-spec/report.md
              fi
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "$BRANCH"
          cp .tmp-spec/engine.yaml openapi.yaml
          cp .tmp-spec/agents.yaml openapi-agents.yaml
          python3 -m pip install --quiet pyyaml
          make enums
          git add openapi.yaml openapi-agents.yaml internal/enums

          # --allow-empty: a ledger entry gone stale needs a pull request even
          # though no file changed.
          git commit --allow-empty \
            -m "Refresh the Engine and Agents API specs" \
            -m "Opened by the weekly spec-sync workflow. The pull request description carries the drift report."
          git push --force origin "$BRANCH"

          {
            cat .tmp-spec/report.md
            printf '\n---\n\n'
            printf '%s\n' \
              "Opened by the weekly **Spec sync** workflow, which never merges." \
              "" \
              "To act on this, follow \`.claude/skills/spec-sync/SKILL.md\`. In short:" \
              "" \
              "- **Needs attention** is what to decide or fix. Add a resource or validator, or classify the endpoint in \`internal/apicontract/coverage.yaml\` with a reason. The test run on this branch fails until every endpoint is classified." \
              "- **Routine** needs nothing: \`make openapi\` has already regenerated the enums on this branch." \
              "- Push fixes to this branch. The workflow will not overwrite commits it did not make."
          } > .tmp-spec/body.md

          gh label create spec-sync --force --color 0E8A16 \
            --description "Opened by the weekly spec-sync workflow"
          gh label create needs-attention --force --color D93F0B \
            --description "The API changed in a way the provider has to answer"

          if [ "$OUTCOME" = attention ]; then
            title="Spec sync: the API changed in ways the provider has to answer"
          else
            title="Spec sync: routine refresh"
          fi

          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file .tmp-spec/body.md --add-label spec-sync
            if [ "$OUTCOME" = attention ]; then
              gh pr edit "$number" --add-label needs-attention
            else
              gh pr edit "$number" --remove-label needs-attention || true
            fi
          else
            labels=spec-sync
            [ "$OUTCOME" = attention ] && labels=spec-sync,needs-attention
            gh pr create --base main --head "$BRANCH" --title "$title" \
              --body-file .tmp-spec/body.md --label "$labels"
          fi

          # Checks do not run on a pull request opened with the default token.
          gh workflow run test.yml --ref "$BRANCH"
