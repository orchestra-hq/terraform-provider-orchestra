name: CI (Tests)

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Match the Go version declared in this repo's go.mod.
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Check code formatting (gofmt)
        run: make format-check

      - name: Run unit tests (and any acceptance tests if present)
        env:
          ORCHESTRA_API_KEY: ${{ secrets.ORCHESTRA_API_KEY }}
        run: go test ./...

