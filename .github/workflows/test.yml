name: CI (Tests)

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The acceptance tests share one live workspace, and some of what they touch is
# workspace-wide: monitor order, incident settings. Two runs at once interfere,
# so they take turns. GitHub keeps only the newest waiting run per group, so a
# waiting run that a newer one displaces is cancelled and needs re-running.
concurrency:
  group: acceptance-workspace
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Match the Go version declared in this repo's go.mod.
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Check code formatting (gofmt)
        run: make format-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Includes internal/apicontract, which checks every endpoint and query
      # parameter the provider uses against the committed specs.
      # internal/provider runs `terraform validate` over examples/ as part of
      # the unit suite. It would download the CLI itself, but installing it
      # here keeps the run offline and pinned.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Run unit tests
        run: go test ./...

  # Its own job so the live key can sit behind a protected environment without gating unit tests.
  acceptance:
    needs: test
    # Never on a fork's pull request.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          ORCHESTRA_API_KEY: ${{ secrets.ORCHESTRA_API_KEY }}
        run: |
          if [ -z "${ORCHESTRA_API_KEY}" ]; then
            echo "ORCHESTRA_API_KEY is not set; skipping acceptance tests."
            exit 0
          fi
          go test ./... -run '^TestAcc' -v -timeout 30m

