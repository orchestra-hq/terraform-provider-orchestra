name: CI (Generate & Commit Docs)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}-docs
  cancel-in-progress: true

jobs:
  generate-and-commit-docs:
    # Avoid running on forks (GITHUB_TOKEN can't push) and avoid reruns caused by our own commits.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      # No API key: tfplugindocs never configures the provider, and this job runs PR code.
      - name: Generate provider docs (tfplugindocs)
        run: make docs

      - name: Commit updated docs/
        env:
          # Used by `git push` after we create a commit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Branch names may contain shell syntax; never interpolate them into the script.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs; then
            echo "No doc changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: update generated Terraform docs" || exit 0

          # Push back to the PR branch.
          git push origin "HEAD:refs/heads/${HEAD_REF}"

