name: CI (Generate & Commit Docs)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}-docs
  cancel-in-progress: true

jobs:
  generate-and-commit-docs:
    # Avoid running on forks (GITHUB_TOKEN can't push) and avoid reruns caused by our own commits.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4

      - name: Generate provider docs (tfplugindocs)
        env:
          # tfplugindocs/terraform may initialize the provider; keep it non-empty in case init reads it.
          ORCHESTRA_API_KEY: ${{ secrets.ORCHESTRA_API_KEY }}
        run: make docs

      - name: Commit updated docs/
        env:
          # Used by `git push` after we create a commit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs; then
            echo "No doc changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: update generated Terraform docs" || exit 0

          # Push back to the PR branch.
          git push origin "HEAD:${{ github.head_ref }}"

