version: v1
name: Orders

pipeline:
  ingest:
    integration: FIVETRAN
    integration_job: FIVETRAN_SYNC_ALL
    parameters:
      connector_id: warehouse_orders

  check_orders:
    depends_on: [ingest]
    integration: SNOWFLAKE
    integration_job: SNOWFLAKE_RUN_QUERY
    parameters:
      statement: SELECT COUNT(*) FROM raw.orders
