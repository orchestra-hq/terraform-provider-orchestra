version: v1
name: Daily sales

schedule:
  - name: nightly
    cron: "0 2 * * ? *"
    timezone: Europe/London

configuration:
  retries: 1

pipeline:
  ingest:
    integration: FIVETRAN
    integration_job: FIVETRAN_SYNC_ALL
    parameters:
      connector_id: warehouse_orders

  transform:
    name: Transform
    depends_on: [ingest]
    tasks:
      dbt_build:
        integration: DBT_CORE
        integration_job: DBT_CORE_EXECUTE
        parameters:
          commands: dbt build --select tag:daily
        configuration:
          retries: 2
          timeout: 3600
