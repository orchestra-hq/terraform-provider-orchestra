provider:
  name: orchestra

resources:
  pipeline:
    create:
      path: /pipelines
      method: POST
    read:
      path: /pipelines
      method: GET
    update:
      path: /pipelines/{alias}
      method: PUT
    delete:
      path: /pipelines/{alias}
      method: DELETE
    schema:
      ignores:
        - latest_run_id
        - latest_run_status
        - latest_run_message
        - latest_run_created_at
        - latest_run_started_at
        - latest_run_completed_at
        - latest_version_number
        - published_version_number
        - current_version_number
        - product_id
        - product_name
        - num_tasks
        - trigger_events
        - webhook
        - sensors
        - schedule
        - page
        - page_size
        - total
      attributes:
        aliases:
          alias: id

  imported_pipeline:
    create:
      path: /pipelines/import
      method: POST
    read:
      path: /pipelines
      method: GET
    delete:
      path: /pipelines/{alias}
      method: DELETE
    schema:
      ignores:
        - data
        - num_tasks
        - page
        - page_size
        - total
      attributes:
        aliases:
          alias: id
          yaml_path: yaml_path_filter

data_sources:
  pipeline_runs:
    read:
      path: /pipeline_runs
      method: GET
    schema:
      ignores:
        - page
        - page_size
        - total

  pipeline_run_status:
    read:
      path: /pipeline_runs/{pipeline_run_id}/status
      method: GET
    schema:
      attributes:
        aliases:
          pipeline_run_id: id

  task_runs:
    read:
      path: /task_runs
      method: GET
    schema:
      ignores:
        - page
        - page_size
        - total

  operations:
    read:
      path: /operations
      method: GET
    schema:
      ignores:
        - page
        - page_size
        - total

  assets:
    read:
      path: /assets
      method: GET
    schema:
      ignores:
        - page
        - page_size
        - total

  pipelines:
    read:
      path: /pipelines
      method: GET

  task_run_logs:
    read:
      path: /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/logs
      method: GET

  task_run_artifacts:
    read:
      path: /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/artifacts
      method: GET

  azure_federated_credentials:
    read:
      path: /compute_resources/azure/federated_credentials
      method: GET
