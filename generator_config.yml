# tfplugingen-openapi input. Mapping rules:
# https://github.com/hashicorp/terraform-plugin-codegen-openapi/blob/main/DESIGN.md#mapping-oas-to-provider-code-specification
provider:
  name: orchestra
resources:
  pipeline:
    create:
      path: /pipelines
      method: POST
    read:
      path: /pipelines
      method: GET
    update:
      path: /pipelines/{alias}
      method: PUT
    delete:
      path: /pipelines/{alias}
      method: DELETE
    schema:
      ignores:
        - latest_run_id
        - latest_run_status
        - latest_run_message
        - latest_run_created_at
        - latest_run_started_at
        - latest_run_completed_at
        - latest_version_number
        - published_version_number
        - current_version_number
        - product_id
        - product_name
        - num_tasks
        - trigger_events
        - webhook
        - sensors
        - schedule
        - page
        - page_size
        - total
      attributes:
        aliases:
          alias: id
data_sources:
  assets:
    read:
      path: /assets
      method: GET
    schema:
      ignores:
        - page
        - page_size
        - total
  azure_federated_credentials:
    read:
      path: /compute_resources/azure/federated_credentials
      method: GET
  pipelines:
    read:
      path: /pipelines
      method: GET
