# Operations the provider deliberately does not implement, and properties of
# the request bodies it sends that it deliberately leaves out, and why.
#
# This lists exclusions only. What the provider does implement is read from its
# own source by the contract tests, so the two cannot drift apart: an operation
# in the spec that is neither called nor listed here fails
# TestEverySpecOperationIsClassified, and a property of a request body the
# provider sends that is neither sent nor listed here, as "Schema.property",
# fails TestEveryWrittenPropertyIsClassified, until someone decides.
#
# The reason is the point of the file. Declarative configuration belongs in
# Terraform; run history, incidents and one-shot actions do not. When you add an
# entry, say which of those it is, and when the answer is "not yet", say what
# would change it.
#
# Top-level keys name a spec:
#   engine  openapi.yaml, the Engine API
#   agents  openapi-agents.yaml, the Agents API
#   admin   https://docs.getorchestra.io/api/admin.yaml
# The first two are committed and checked by TestEverySpecOperationIsClassified.
# admin is fetched on each scheduled run and checked against its list, so a new
# endpoint in it is still noticed.

engine:
  run_history:
    reason: >-
      What ran and what it produced: run history, task runs, logs, artifacts,
      audit events, and the engine's own incremental-sync state. It changes on
      every run, so Terraform state would show a permanent diff. Export it with
      dlt or the Snowflake app instead.
    operations:
      - "GET /pipeline_runs"
      - "GET /pipeline_runs/{pipeline_run_id}/status"
      - "GET /pipeline_runs/{pipeline_run_id}/task_runs"
      - "GET /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/artifacts"
      - "GET /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/artifacts/download"
      - "GET /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/logs"
      - "GET /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/logs/download"
      - "GET /task_runs"
      - "GET /operations"
      - "GET /audit_events"
      - "GET /state/{integration}"
      - "PATCH /state/{integration}"

  incidents:
    reason: >-
      Incidents are runtime records that people and the engine open, merge, mute
      and comment on. The declarative side, which failures group into an
      incident and how it alerts, is orchestra_monitor.
    operations:
      - "GET /incidents"
      - "GET /incidents/{incident_id}"
      - "PATCH /incidents/{incident_id}"
      - "GET /incidents/{incident_id}/events"
      - "GET /incidents/{incident_id}/events/{incident_event_id}/external_event"
      - "POST /incidents/events"
      - "POST /incidents/{incident_id}/comments"
      - "POST /incidents/{incident_id}/merge"
      - "POST /incidents/{incident_id}/unmerge"
      - "POST /incidents/{incident_id}/mute"
      - "POST /incidents/{incident_id}/unmute"

  actions:
    reason: >-
      One-shot commands, not state. Applying one twice means something
      different from applying it once, which no Terraform resource can express.
    operations:
      - "POST /pipelines/{pipeline_id_or_alias}/start"
      - "POST /pipeline_runs/{pipeline_run_id}/cancel"
      - "POST /task_runs/{task_run_id}/outputs"

  catalogue:
    reason: >-
      Static reference data: the integrations, jobs and sensor checks Orchestra
      supports. internal/enums generates the same values from the spec, so a
      data source would only restate them over the network.
    operations:
      - "GET /integrations/"
      - "GET /integrations/jobs"
      - "GET /integrations/{integration}"
      - "GET /sensor_checks/"

  git_backed_pipelines:
    reason: >-
      A pipeline whose definition lives in a repository is owned by Orchestra's
      git sync. Terraform would be a second writer to the same file. Removed
      deliberately; see the README. The create request's repository, file,
      branch and commit message fields only apply to such a pipeline, and the
      provider always creates with storageProvider ORCHESTRA.
    operations:
      - "POST /pipelines/import"
      - "PATCH /pipelines/storage-settings"
    properties:
      - "PublicCreatePipelineRequest.repository"
      - "PublicCreatePipelineRequest.yamlPath"
      - "PublicCreatePipelineRequest.defaultBranch"
      - "PublicCreatePipelineRequest.workingBranch"
      - "PublicCreatePipelineRequest.message"
      - "PublicCreatePipelineRequest.messageIsCustom"

  oauth_sign_in:
    reason: >-
      Where the Orchestra UI returns after a browser sign-in.
      orchestra_integration_connection refuses integrations that sign in with
      OAuth, which Terraform cannot complete, so there is nothing to return to.
    properties:
      - "IntegrationAuthRequest.callbackPath"
      - "PartialIntegrationAuthRequest.callbackPath"

  candidate_properties:
    reason: >-
      Settable through the API, but not yet modelled by the provider. Each one
      wants an attribute rather than a longer list. validationParams runs an
      extra check of a connection's credentials; it needs a decision on whether
      the API stores it.
    properties:
      - "IntegrationAuthRequest.validationParams"
      - "PartialIntegrationAuthRequest.validationParams"

  assets:
    reason: >-
      Assets are discovered from integrations rather than declared, and the API
      cannot read or delete a lineage edge, so Terraform could create edges but
      never detect drift on them or remove them. Listing assets is covered by
      the orchestra_assets data source. Removed deliberately; see the README.
    operations:
      - "POST /assets"
      - "GET /assets/{asset_id}"
      - "PATCH /assets/{asset_id}"
      - "DELETE /assets/{asset_id}"
      - "POST /assets/dependencies"

agents:
  agents_listing:
    reason: >-
      Listing agents only finds IDs, and orchestra_agent imports by ID.
      orchestra_skills exists because an agent can use the skills Orchestra
      publishes, which Terraform cannot create; there is no equivalent for
      agents. Build it if someone needs it.
    operations:
      - "GET /agents"

  agents_runtime:
    reason: >-
      Conversations with an agent, its token usage and a catalogue of avatars:
      runtime records and reference data, not configuration.
    operations:
      - "GET /sessions"
      - "POST /sessions"
      - "GET /sessions/{session_id}"
      - "POST /sessions/{session_id}"
      - "GET /sessions/{session_id}/history/messages"
      - "GET /sessions/{session_id}/history"
      - "POST /sessions/{session_id}/cancel"
      - "GET /usage"
      - "GET /agents/avatar-catalog"

admin:
  accounts:
    reason: >-
      Lists workspaces, from the Platform API at a different base URL. Choosing
      an account is provider configuration (`account_id`), not data a
      configuration could read before the provider exists.
    operations:
      - "GET /accounts"
