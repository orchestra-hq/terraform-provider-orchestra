        write several over its life, but posting the same text twice returns the row
        already written.


        `description` sets the incident''s description alongside an `AI_DIAGNOSIS_COMPLETED`
        or `AI_DIAGNOSIS_FAILED` row, and needs edit permission on the incident. It
        is not applied over a description a person wrote.


        The timeline is append-only: nothing can edit or delete a row once it is there.'
