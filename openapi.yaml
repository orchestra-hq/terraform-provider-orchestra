components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API key from your Orchestra workspace settings. Pass as `Authorization:
        Bearer <API_KEY>`.'
  schemas:
    AirflowWebhookRequest:
      properties:
        integration:
          type: string
          const: AIRFLOW
          title: Integration
        dagId:
          type: string
          title: Dagid
        dagRunId:
          type: string
          title: Dagrunid
      additionalProperties: false
      type: object
      required:
      - integration
      - dagId
      - dagRunId
      title: AirflowWebhookRequest
      description: Webhook payload for Airflow DAG run completion notifications.
    AlertDestinationModel:
      properties:
        integration:
          $ref: '#/components/schemas/NotificationTypesEnum'
        destination:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination
        connectionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Connectionid
        parameters:
          anyOf:
          - $ref: '#/components/schemas/BaseDatadogNotificationParametersModel'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - integration
      title: AlertDestinationModel
    AlertLevelTypes:
      type: string
      enum:
