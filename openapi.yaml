      title: SensorCheckModel
      description: 'Defines a single check within a sensor.


        Sensor checks query external systems (e.g., Snowflake, S3) to determine if

        conditions are met. All checks in a sensor must pass for the sensor to trigger

        the pipeline.'
    SensorChecksEnum:
      type: string
      enum:
      - ADLS_FILE
      - AWS_S3_FILE
      - DATABRICKS_QUERY
      - FABRIC_SYNAPSE_QUERY
      - GCP_BIG_QUERY_QUERY
      - ORCHESTRA_PIPELINE_STATUS
      - ORCHESTRA_WEBHOOK_EVENT
      - SNOWFLAKE_QUERY
      - SFTP_FILE
      - SQL_SERVER_QUERY
      title: SensorChecksEnum
    SensorModel:
      properties:
        name:
          type: string
          maxLength: 100
          title: Name
          description: Sensor name for display and reference (max 100 chars).
        cron:
          type: string
          title: Cron
          description: AWS EventBridge cron expression defining when the sensor evaluation
            window opens. Same 6-field format as schedule cron.
        timezone:
          type: string
          title: Timezone
          description: IANA timezone for schedule evaluation.
        timeoutMins:
          type: integer
          maximum: 7200.0
          title: Timeoutmins
          description: Maximum minutes to wait for all checks to pass (max 7200 minutes).
            Must be shorter than the interval between cron invocations.
        environments:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
          - type: 'null'
          title: Environments
          description: Environment(s) to run in when sensor triggers.
        checks:
          additionalProperties:
            $ref: '#/components/schemas/SensorCheckModel'
          type: object
          title: Checks
          description: Dictionary of sensor checks that must all pass. At least one
            required.
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: Expression evaluated after all checks pass, before triggering
            the pipeline. Uses ${{ expression }} syntax.
        exclude:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Exclude
          description: List of dates (YYYY-MM-DD) to skip sensor evaluation.
        frequencySecs:
          anyOf:
          - type: integer
          - type: 'null'
          title: Frequencysecs
          description: How often checks are evaluated within the open window, in seconds
            (60-600, default 60).
        runInputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Runinputs
          description: Input values to pass when sensor triggers pipeline.
        alerts:
          anyOf:
          - items:
              $ref: '#/components/schemas/AlertModel'
            type: array
          - type: 'null'
          title: Alerts
      additionalProperties: false
      type: object
      required:
      - name
      - cron
      - timezone
      - timeoutMins
      - checks
      title: SensorModel
      description: "Defines a sensor that monitors external systems and triggers a\
        \ pipeline when conditions are met.\n\nPolling model: The cron expression\
        \ opens a check window. Within the window, checks are\nevaluated at frequencySecs\
        \ intervals (default 60s). The pipeline triggers when ALL checks\npass, or\
        \ the timeout is reached. Triggers use OR-logic \u2014 any single trigger\
        \ (schedule,\nsensor, webhook, or triggerEvent) firing starts a pipeline run."
    StartPipelineResponse:
      properties:
        id:
          type: string
          format: uuid4
