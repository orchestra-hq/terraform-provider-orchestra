      - ORGANISATION
      - PIPELINE
      - PIPELINE_RUN
      - PRODUCT
      - SKILL
      - TASK_RUN
      - USER
      title: AuditResourceTypeEnum
      description: 'What an audited action was performed on. Used for filtering and
        for the per-resource

        history tab, so it is a typed column rather than free text.'
    IncidentTriggerTypeEnum:
      type: string
      enum:
      - ANOMALY
      - EXTERNAL
      - FAILED
      - WARNING
      title: IncidentTriggerTypeEnum
      description: 'The kind of signal that produced an incident event. Producers
        state what happened;

        the Incident Manager maps it to a severity and applies the grouping invariants.'
    PaginatedResponse_AuditEventResponse_:
      properties:
        page:
          type: integer
          title: Page
        pageSize:
          type: integer
          title: Pagesize
        total:
          type: integer
          title: Total
        results:
          items:
            $ref: '#/components/schemas/AuditEventResponse'
          type: array
          title: Results
      additionalProperties: false
      type: object
      required:
      - page
      - pageSize
      - total
      - results
      title: PaginatedResponse[AuditEventResponse]
    Duration:
      type: string
      format: duration
      gt: PT0S
    IncidentAlertThreadResponse:
      properties:
        integration:
          $ref: '#/components/schemas/IntegrationsEnum'
        channelName:
          type: string
          title: Channelname
        url:
          type: string
          title: Url
      additionalProperties: false
      type: object
      required:
      - integration
      - channelName
      - url
      title: IncidentAlertThreadResponse
      description: The thread an incident's first alert started in a channel, and
        the channel's name.
    JsonPath:
      type: string
    LabelKey:
      type: string
      maxLength: 64
      minLength: 1
      pattern: ^[a-zA-Z0-9_.:/-]+$
    LabelMatch:
      properties:
        path:
          $ref: '#/components/schemas/JsonPath'
        values:
          items:
            type: string
          type: array
          minItems: 1
          title: Values
      additionalProperties: false
      type: object
      required:
      - path
      - values
      title: LabelMatch
      description: One place on an event body a label is read from, and the values
        that match there.
    MonitorAction:
      properties:
        mute:
          type: boolean
          title: Mute
          default: false
        severity:
          anyOf:
          - $ref: '#/components/schemas/IncidentSeverityEnum'
          - type: 'null'
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
        subscribers:
          items:
            type: string
          type: array
          maxItems: 20
          title: Subscribers
          default: []
        alerts:
          $ref: '#/components/schemas/MonitorAlerts'
      additionalProperties: false
      type: object
      title: MonitorAction
      description: 'What happens to the events this monitor claimed.


        ``mute`` claims them and sends no alert - the known-broken-thing case. They
        are still

        recorded, on incidents the monitor owns, so a mute is silent without being
        invisible.'
    MonitorAlerts:
      properties:
        destinations:
          anyOf:
          - items:
              $ref: '#/components/schemas/AlertDestinationModel'
            type: array
          - type: 'null'
          title: Destinations
        alsoSendToPipelineDestinations:
          type: boolean
          title: Alsosendtopipelinedestinations
          default: false
      additionalProperties: false
      type: object
      title: MonitorAlerts
      description: 'Where this monitor''s incidents alert. How many alerts one may
        send and when it

        re-alerts stay account-wide in ``IncidentSettings``.


        ``destinations`` left out inherits the pipeline''s own; given, it replaces
        them, so an

        author redirecting alerts does not double-send by default.'
    MonitorDefinition:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          type: boolean
          title: Enabled
          default: true
        order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Order
        match:
          $ref: '#/components/schemas/MonitorMatch'
        groupBy:
          items:
            anyOf:
            - $ref: '#/components/schemas/MonitorGroupByEnum'
            - $ref: '#/components/schemas/GroupByLabel'
          type: array
          maxItems: 32
          minItems: 1
          title: Groupby
        trigger:
          anyOf:
          - $ref: '#/components/schemas/MonitorTrigger'
          - type: 'null'
        action:
          $ref: '#/components/schemas/MonitorAction'
      additionalProperties: false
      type: object
      required:
      - name
      - match
      - groupBy
      title: MonitorDefinition
      description: 'One monitor, as authored.


        ``order`` breaks the tie where two monitors both claim an event, lower winning.
        Left

        out, a new monitor goes last and an edited one keeps its place, so creating
        a monitor

        never silently takes events an existing one claims.

        Overlap is not rejected here: match sets are dynamic, so two monitors that
        do not

        overlap today may overlap tomorrow when an asset appears.'
    MonitorGroupByEnum:
      type: string
      enum:
      - asset
      - task
      - pipeline
      - connection
      - monitor
      - downstream_assets
      title: MonitorGroupByEnum
      description: 'What makes two events this monitor claimed one incident.


        Every value but ``MONITOR`` resolves to a typed column that already exists
        on

        ``incident_events``. ``MONITOR`` means "everything this monitor claims is
        one

        incident", which is served by ``monitor_id`` on the incident instead.'
    MonitorMatch:
      properties:
        pipelines:
          items:
            type: string
            format: uuid4
          type: array
          title: Pipelines
        assets:
          items:
            type: string
            format: uuid4
          type: array
          title: Assets
        connections:
          items:
            type: string
          type: array
          title: Connections
        integrations:
          items:
            $ref: '#/components/schemas/IntegrationsEnum'
          type: array
          title: Integrations
        labels:
          additionalProperties:
            items:
              $ref: '#/components/schemas/LabelMatch'
            type: array
            minItems: 1
          propertyNames:
            $ref: '#/components/schemas/LabelKey'
          type: object
          maxProperties: 32
          title: Labels
        operationFailuresOnly:
          type: boolean
          title: Operationfailuresonly
          default: false
      additionalProperties: false
      type: object
      title: MonitorMatch
      description: 'Which events a monitor claims: AND across dimensions, OR within
        a list.


        At least one dimension has to be given. A monitor matching every dimension
        by saying

        nothing would claim every event on the account, which is never what an author
        means.'
    MonitorResponse:
      properties:
        monitorId:
          type: string
          format: uuid4
          title: Monitorid
        definition:
          $ref: '#/components/schemas/MonitorDefinition'
        createdAt:
          type: string
          title: Createdat
        createdBy:
          type: string
          format: uuid4
          title: Createdby
        updatedAt:
          type: string
          title: Updatedat
        updatedBy:
          type: string
          format: uuid4
          title: Updatedby
      additionalProperties: false
      type: object
      required:
      - monitorId
      - definition
      - createdAt
      - createdBy
      - updatedAt
      - updatedBy
      title: MonitorResponse
      description: A monitor as authored, plus who made and last changed it.
    MonitorTrigger:
      properties:
        count:
          type: integer
          exclusiveMinimum: 1.0
          title: Count
        within:
          $ref: '#/components/schemas/Duration'
      additionalProperties: false
      type: object
      required:
      - count
      - within
      title: MonitorTrigger
      description: 'The threshold a counting monitor fires on. Its presence is what
        makes the monitor a

        threshold monitor, so there is no separate kind field.'
    PausePipelineRequestModel:
      properties:
        paused:
          type: boolean
          title: Paused
      additionalProperties: false
      type: object
      required:
      - paused
      title: PausePipelineRequestModel
      description: Request body for pausing a pipeline.
    ReorderMonitorsRequest:
      properties:
        monitorIds:
          items:
            type: string
            format: uuid4
          type: array
          title: Monitorids
      additionalProperties: false
      type: object
      required:
      - monitorIds
      title: ReorderMonitorsRequest
      description: Every monitor on the account, in the order they should be evaluated.
    ExternalEventResponse:
      properties:
        eventId:
          type: string
          format: uuid
          title: Eventid
      additionalProperties: false
      type: object
      required:
      - eventId
      title: ExternalEventResponse
      description: 'The id of an accepted event.


        There is no incident id: the event is only queued here, and it is matched
        to a

        monitor and grouped into an incident afterwards.'
    IncidentExternalEventResponse:
      properties:
        incidentEventId:
          type: string
          format: uuid4
          title: Incidenteventid
        payload:
          additionalProperties: true
          type: object
          title: Payload
      additionalProperties: false
      type: object
      required:
      - incidentEventId
      - payload
      title: IncidentExternalEventResponse
      description: The body an external system sent for one timeline row, exactly
        as it was received.
    GroupByLabel:
      properties:
        label:
          $ref: '#/components/schemas/LabelKey'
        path:
          $ref: '#/components/schemas/JsonPath'
      additionalProperties: false
      type: object
      required:
      - label
      - path
      title: GroupByLabel
      description: 'A place on an event body to group on. ``label`` is what the incident''s
        name and alert

        call the value found at ``path``.'
    AlertBudgetRefillCadenceEnum:
      type: string
      enum:
      - never
      - daily
      - weekly
      title: AlertBudgetRefillCadenceEnum
      description: 'How often the per-incident alert budget comes back. Three named
        choices only - a

        free-form interval asks a first-time user for an opinion they do not have
        yet.'
    IncidentSettingsResponse:
      properties:
        incidentsEnabled:
          type: boolean
          title: Incidentsenabled
          default: false
        requireAlertConfigured:
          type: boolean
          title: Requirealertconfigured
          default: true
        requireDefaultBranchOrPublishedVersion:
          type: boolean
          title: Only default branches and published versions
          description: Only raise incidents for runs on a Git-backed pipeline's default
            branch, or of an Orchestra-backed pipeline's published version.
          default: true
        environmentIds:
          items:
            type: string
            format: uuid4
          type: array
          title: Environments
          description: Only failures from these environments open or join an incident;
            leave it empty for every environment.
          default: []
        warningsEnabled:
          type: boolean
          title: Warningsenabled
          default: false
        groupWarningWithFailed:
          type: boolean
          title: Groupwarningwithfailed
          default: true
        autoResolveOnSuccess:
          type: boolean
          title: Auto-resolve on success
          description: Resolve an open incident once every resource it covers has
            succeeded again.
          default: false
        maxAlertsPerIncident:
          type: integer
          maximum: 50.0
          exclusiveMinimum: 0.0
          title: Max alerts per incident
          description: Cap on the number of live alerts sent for a single incident
            before further updates are rolled into a single rollup notice instead
            of sent individually. This budget applies to each alert destination.
          default: 3
        alertBudgetRefillCadence:
          $ref: '#/components/schemas/AlertBudgetRefillCadenceEnum'
          title: Alert budget refill cadence
          description: How often the budget above comes back. Never means it is spent
            once per incident and does not return until the incident is resolved.
          default: daily
        autoDiagnoseIncidents:
          type: boolean
          title: Auto-diagnose incidents
          description: Have Orchestra's diagnoser investigate incidents as they open
            and grow.
          default: true
        updatedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Updatedat
      additionalProperties: false
      type: object
      title: IncidentSettingsResponse
      description: An account's current incident settings.
    PatchIncidentSettingsRequest:
      properties:
        incidentsEnabled:
          type: boolean
          title: Incidentsenabled
          default: false
        requireAlertConfigured:
          type: boolean
          title: Requirealertconfigured
          default: true
        requireDefaultBranchOrPublishedVersion:
          type: boolean
          title: Only default branches and published versions
          description: Only raise incidents for runs on a Git-backed pipeline's default
            branch, or of an Orchestra-backed pipeline's published version.
          default: true
        environmentIds:
          items:
            type: string
            format: uuid4
          type: array
          title: Environments
          description: Only failures from these environments open or join an incident;
            leave it empty for every environment.
          default: []
        warningsEnabled:
          type: boolean
          title: Warningsenabled
          default: false
        groupWarningWithFailed:
          type: boolean
          title: Groupwarningwithfailed
          default: true
        autoResolveOnSuccess:
          type: boolean
          title: Auto-resolve on success
          description: Resolve an open incident once every resource it covers has
            succeeded again.
          default: false
        maxAlertsPerIncident:
          type: integer
          maximum: 50.0
          exclusiveMinimum: 0.0
          title: Max alerts per incident
          description: Cap on the number of live alerts sent for a single incident
            before further updates are rolled into a single rollup notice instead
            of sent individually. This budget applies to each alert destination.
          default: 3
        alertBudgetRefillCadence:
          $ref: '#/components/schemas/AlertBudgetRefillCadenceEnum'
          title: Alert budget refill cadence
          description: How often the budget above comes back. Never means it is spent
            once per incident and does not return until the incident is resolved.
          default: daily
        autoDiagnoseIncidents:
          type: boolean
          title: Auto-diagnose incidents
          description: Have Orchestra's diagnoser investigate incidents as they open
            and grow.
          default: true
      additionalProperties: false
      type: object
      title: PatchIncidentSettingsRequest
      description: 'Request to change an account''s incident settings. Omitted toggles
        keep

        their stored value; an unknown rule key is rejected.'
    IntegrationAuthRequest:
      properties:
        connectionName:
          type: string
          title: Connectionname
          description: Display name for the connection.
        credentialStore:
          $ref: '#/components/schemas/CredentialStoresEnum'
          description: Where the secrets live. ORCHESTRA stores them encrypted in
            Orchestra; an external store takes that store's reference parameters instead.
          default: ORCHESTRA
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
          description: Auth parameters, keyed by the field names in the integration's
            authSchema.
        validationParams:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Validationparams
          description: Parameters matching the integration's validateSchema. Supplying
            them runs an extra validation against the provider once the connection
            authenticates.
        callbackPath:
          anyOf:
          - type: string
          - type: 'null'
          title: Callbackpath
      additionalProperties: false
      type: object
      required:
      - connectionName
      - parameters
      title: IntegrationAuthRequest
      description: Request to create or authenticate an integration connection.
    IntegrationOAuthRedirectResponse:
      properties:
        accountId:
          type: string
          format: uuid4
          title: Accountid
        connectionId:
          type: string
          title: Connectionid
        integration:
          $ref: '#/components/schemas/IntegrationsEnum'
        redirectUrl:
          type: string
          title: Redirecturl
      additionalProperties: false
      type: object
      required:
      - accountId
      - connectionId
      - integration
      - redirectUrl
      title: IntegrationOAuthRedirectResponse
      description: Response containing an OAuth redirect URL for browser-based auth
        flows.
    PartialIntegrationAuthRequest:
      properties:
        connectionName:
          anyOf:
          - type: string
          - type: 'null'
          title: Connectionname
        credentialStore:
          anyOf:
          - $ref: '#/components/schemas/CredentialStoresEnum'
          - type: 'null'
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Parameters
        validationParams:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Validationparams
          description: Parameters matching the integration's validateSchema. Supplying
            them runs an extra validation against the provider once the connection
            authenticates.
        callbackPath:
          anyOf:
          - type: string
          - type: 'null'
          title: Callbackpath
        isDefault:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isdefault
      additionalProperties: false
      type: object
      title: PartialIntegrationAuthRequest
      description: Request to partially update an integration connection. Only one
        field group at a time.
    SingleIntegrationAuthResponse:
      properties:
        accountId:
          type: string
          format: uuid4
          title: Accountid
        connectionId:
          type: string
          title: Connectionid
        integration:
          $ref: '#/components/schemas/IntegrationsEnum'
        connectionName:
          type: string
          title: Connectionname
        isDefault:
          type: boolean
          title: Isdefault
        credentialStore:
          anyOf:
          - $ref: '#/components/schemas/CredentialStoresEnum'
          - type: 'null'
          default: ORCHESTRA
        authStatus:
          $ref: '#/components/schemas/AuthStatus'
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        externalMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalmessage
        updatedAt:
          type: string
          title: Updatedat
        createdAt:
          type: string
          title: Createdat
        parameters:
          $ref: '#/components/schemas/BaseModel'
      additionalProperties: false
      type: object
      required:
      - accountId
      - connectionId
      - integration
      - connectionName
      - isDefault
      - authStatus
      - message
      - updatedAt
      - createdAt
      - parameters
      title: SingleIntegrationAuthResponse
      description: An integration connection and its auth parameters. Secret parameters
        are obfuscated.
    BaseModel:
      properties: {}
      type: object
      title: BaseModel
    CredentialStoresEnum:
      type: string
      enum:
      - ORCHESTRA
      - AWS_SECRETS_MANAGER
      - AZURE_KEY_VAULT
      title: CredentialStoresEnum
    ConcurrencyOnLimit:
      type: string
      enum:
      - SKIP
      - QUEUE
      - QUEUE_LATEST
      title: ConcurrencyOnLimit
    ParameterizedEnumStr_ConcurrencyOnLimit_:
      anyOf:
      - $ref: '#/components/schemas/ConcurrencyOnLimit'
      - type: string
        pattern: \$\{\{\s*([^}]+?)\s*\}\}
    PipelineFolderRequest:
      properties:
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
          description: Folder path to move an Orchestra-backed pipeline to, such as
            `finance/daily`. Send null or an empty string for no folder.
      additionalProperties: false
      type: object
      required:
      - folder
      title: PipelineFolderRequest
      description: Moves a pipeline to another folder, leaving its definition and
        versions as they are.
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: 'An API key from your workspace settings, passed as `Authorization:
        Bearer <API_KEY>`. A read-only key works on endpoints that only read.'
    OAuth:
      type: oauth2
      description: 'An access token issued to a user by Orchestra, passed as `Authorization:
        Bearer <ACCESS_TOKEN>`. Clients register themselves at the authorization server;
        there is no client secret.'
      flows:
        authorizationCode:
          authorizationUrl: https://app.getorchestra.io/oauth/authorize
          tokenUrl: https://app.getorchestra.io/oauth/token
          refreshUrl: https://app.getorchestra.io/oauth/token
          scopes:
            orchestra:read: Read data in the workspaces you can access.
            orchestra:write: Read and change data in the workspaces you can access.
  responses:
    BadRequest:
      description: The request was invalid for the current resource state.
    Unauthorized:
      description: The request was not authorized. Check the API key and `Authorization`
        header.
    Forbidden:
      description: The request was forbidden, or the Metadata API is not enabled for
        this workspace.
    NotFound:
      description: The requested resource was not found.
    Conflict:
      description: The request conflicts with an existing resource.
    RateLimited:
      description: Too many requests. Wait before sending more requests.
    GatewayTimeout:
      description: The pipeline start request timed out. Try again.
security:
- ApiKey: []
- OAuth:
  - orchestra:read
servers:
- url: https://app.getorchestra.io/api/engine/public
  description: Production
tags:
- name: Pipeline Runs
  description: Endpoints for querying, polling, and cancelling pipeline runs
- name: Task Runs
  description: Endpoints for querying task runs
- name: Operations
  description: Endpoints for querying task operations
- name: Assets
  description: Endpoints for querying and managing assets
- name: Asset Dependencies
  description: Endpoints for managing asset lineage dependencies
- name: Pipelines
  description: Endpoints for creating, importing, validating, updating, deleting,
    and starting pipelines
- name: Sensor Checks
  description: Endpoints for listing available sensor checks
- name: State
  description: Endpoints for fetching and updating sao-paolo state
- name: Logs
  description: Endpoints for listing and downloading task run logs
- name: Artifacts
  description: Endpoints for listing and downloading task run artifacts
- name: Compute Resources
  description: Endpoints for compute resource configuration details
- name: Integrations
  description: Endpoints for listing available integrations and integration jobs in
    Orchestra
- name: Integration Connections
  description: Endpoints for listing, creating, updating, and deleting integration
    connections. Secret auth parameters are obfuscated in responses
- name: Environments
  description: Endpoints for managing environments
