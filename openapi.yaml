      description: 'Retrieve a paginated list of assets for the workspace linked to
        the API key.


        Assets can be filtered by type, integration, integration account, workspace,
        database, schema, status, or asset ID. By default, results are sorted by `created_in_integration`
        in descending order.

        '
      tags:
      - Assets
      security:
      - BearerAuth: []
    post:
      summary: Create an asset
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: Resource created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
