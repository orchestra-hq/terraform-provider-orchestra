  /pipelines/{pipeline_id_or_alias}/start:
    post:
      tags:
      - Pipelines
      summary: Start a pipeline run
      description: 'Start a pipeline run. The pipeline can be identified by alias
        or pipeline ID.


        All request body fields are optional. Use `branch` and `commit` for Git-backed
        pipelines, `versionNumber` for Orchestra-backed published versions, and `runInputs`
        for values required by pipeline inputs. The response includes a `pipelineRunId`
        you can use to poll run status.


        Any other JSON body, such as a webhook sent by another tool, still starts
        the run, with default options; `requestBodyMessage` and `requestBodyErrors`
        in the response say which happened. Either way the whole body is available
        to the pipeline''s `webhook.runInputs` as `${{ outputs.payload }}`, for example
        `${{ outputs.payload.connection_id }}`, or `${{ outputs.payload[''connectionId'']
        }}` for a key with capitals, so task conditions can act on it through `${{
        inputs.<name> }}`. Bodies over 64 KiB are not kept.'
