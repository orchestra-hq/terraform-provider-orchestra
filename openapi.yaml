  /task_runs:
    get:
      tags:
      - Task Runs
      summary: List task runs
      description: "Retrieve a paginated list of [task runs](/docs/core-concepts/tasks/task-runs)\
        \ for the workspace the credential resolves to.\n\n<Note>\n  `time_from` and\
        \ `time_to` are optional. If neither is provided, the API returns the last\
        \ 24 hours of data. If both are provided, the maximum time range per request\
        \ is 7 days. `time_from` cannot be earlier than 2023-01-01.\n\n  From 2026-10-01\
        \ the default changed from the last 7 days to the last 24 hours. Pass `time_from`\
        \ and `time_to` explicitly to control the window.\n</Note>\n\nFilter by multiple\
        \ statuses, integrations, pipeline IDs, or task run IDs using comma-separated\
        \ values. For example, `status=SUCCEEDED,FAILED&integration=HTTP,SNOWFLAKE`\
        \ returns task runs matching either status and either integration."
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
        description: Page number. Must be greater than or equal to 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
        description: Number of items per page. Defaults to 50; maximum 100.
      - name: time_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          format: date-time
          title: Time From
        description: Start of the time window as an ISO 8601 datetime.
      - name: time_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          format: date-time
          title: Time To
        description: End of the time window as an ISO 8601 datetime.
      - name: pipeline_ids
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Pipeline Ids
        description: Filter by pipeline IDs. Provide comma-separated UUIDs for multiple
          values.
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Status
        description: Filter by status. Comma-separated values are supported where
          the parameter accepts multiple values.
      - name: integration
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Integration
        description: Integration identifier.
      - name: task_run_ids
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Task Run Ids
        description: Filter by task run IDs. Provide comma-separated UUIDs for multiple
          values.
      - name: include_superseded
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Superseded
        description: Include superseded task runs, which are the earlier attempts
          of a task that was retried. Set to false to return only the latest attempt
          of each task.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
