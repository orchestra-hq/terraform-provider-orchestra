        '409':
          $ref: '#/components/responses/Conflict'
      description: 'Create a data asset in the workspace linked to the API key.


        Use this endpoint when an external system needs to register an asset for metadata,
        lineage, and observability workflows. The `externalId` must be unique for
        the workspace.

        '
      tags:
      - Assets
      security:
      - BearerAuth: []
