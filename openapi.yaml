      title: ScheduleModel
    SensorCheckModel:
      properties:
        integration:
          $ref: '#/components/schemas/IntegrationsEnum'
          description: Integration platform for this check (e.g., SNOWFLAKE, S3).
        connection:
          anyOf:
          - $ref: '#/components/schemas/TemplatedConnectionID'
          - type: 'null'
          description: Named connection to use for this check.
        sensorType:
          $ref: '#/components/schemas/SensorChecksEnum'
          description: Type of sensor check to perform.
        parameters:
          $ref: '#/components/schemas/BaseSensorParametersModel'
          description: Integration-specific parameters for the check.
        mapOutputs:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Mapoutputs
          description: Maps check result fields to pipeline input names. Keys are
            pipeline input names, values are output field references from the check
            result.
      additionalProperties: false
      type: object
      required:
      - integration
      - sensorType
      - parameters
      title: SensorCheckModel
      description: 'Defines a single check within a sensor.


        Sensor checks query external systems (e.g., Snowflake, S3) to determine if

        conditions are met. All checks in a sensor must pass for the sensor to trigger

        the pipeline.'
    SensorChecksEnum:
      type: string
      enum:
      - ADLS_FILE
      - AWS_S3_FILE
      - CLICKHOUSE_QUERY
      - DATABRICKS_QUERY
      - FABRIC_SYNAPSE_QUERY
      - GCP_BIG_QUERY_QUERY
      - GCP_CLOUD_STORAGE_FILE
      - MARIADB_QUERY
      - MONGODB_QUERY
      - MYSQL_QUERY
      - ORCHESTRA_PIPELINE_STATUS
      - ORCHESTRA_WEBHOOK_EVENT
      - POSTGRES_QUERY
      - SNOWFLAKE_QUERY
      - SFTP_FILE
      - SHAREPOINT_FILE
      - SQL_SERVER_QUERY
      title: SensorChecksEnum
    SensorModel:
      properties:
        name:
          type: string
          maxLength: 100
          title: Name
          description: Sensor name for display and reference (max 100 chars).
        cron:
          type: string
          title: Cron
          description: AWS EventBridge cron expression defining when the sensor evaluation
            window opens. Same 6-field format as schedule cron.
        timezone:
          type: string
          title: Timezone
          description: IANA timezone for schedule evaluation.
        timeoutMins:
          type: integer
          maximum: 7200.0
          title: Timeoutmins
          description: Maximum minutes to wait for all checks to pass (max 7200 minutes).
            Must be shorter than the interval between cron invocations.
        environments:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
          - type: 'null'
          title: Environments
          description: Environment(s) to run in when sensor triggers.
        checks:
          additionalProperties:
            $ref: '#/components/schemas/SensorCheckModel'
          type: object
          title: Checks
          description: Dictionary of sensor checks that must all pass. At least one
            required.
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: Expression evaluated after all checks pass, before triggering
            the pipeline. Uses ${{ expression }} syntax.
        exclude:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Exclude
          description: List of dates (YYYY-MM-DD) to skip sensor evaluation.
        frequencySecs:
          anyOf:
          - type: integer
          - type: 'null'
          title: Frequencysecs
          description: How often checks are evaluated within the open window, in seconds
            (60-600, default 60).
        runInputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Runinputs
          description: Input values to pass when sensor triggers pipeline.
        alerts:
          anyOf:
          - items:
              $ref: '#/components/schemas/AlertModel'
            type: array
          - type: 'null'
          title: Alerts
      additionalProperties: false
      type: object
      required:
      - name
      - cron
      - timezone
      - timeoutMins
      - checks
      title: SensorModel
      description: 'Defines a sensor that monitors external systems and triggers a
        pipeline when conditions are met.


        Polling model: The cron expression opens a check window. Within the window,
        checks are

        evaluated at frequencySecs intervals (default 60s). The pipeline triggers
        when ALL checks

        pass, or the timeout is reached. Triggers use OR-logic — any single trigger
        (schedule,

        sensor, webhook, or triggerEvent) firing starts a pipeline run.'
    StartPipelineResponse:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        pipelineRunId:
          type: string
          format: uuid4
          title: Pipelinerunid
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          default: ''
      additionalProperties: false
      type: object
      required:
      - id
      - pipelineRunId
      title: StartPipelineResponse
      description: Response returned when starting a pipeline.
    TaskGroupModel:
      properties:
        tasks:
          additionalProperties:
            $ref: '#/components/schemas/TaskModel'
          type: object
          title: Tasks
          description: Dictionary of task definitions within this group. Must have
            at least one.
        dependsOn:
          items:
            type: string
          type: array
          title: Dependson
          description: IDs of other top-level pipeline entries (group or standalone
            task IDs) that must complete before any task in this group runs. This
            is how the DAG is constructed -- dependencies between groups define execution
            order.
          default: []
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: 'Expression using ${{ expression }} syntax applied to ALL tasks
            in the group. Combined with task-level conditions via AND. Example: "${{
            tasks[''upstream_task''].status == ''SUCCEEDED'' }}".'
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
          description: Human-readable name for the group (max 100 chars).
          default: ''
        matrix:
          anyOf:
          - $ref: '#/components/schemas/MatrixBlockModel'
          - type: 'null'
          description: Matrix configuration for running the group multiple times with
            varying inputs. Reference values in tasks via ${{ matrix.<input_name>
            }}. Each value spawns a parallel child iteration of the entire task group.
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
          description: Arbitrary metadata for external tooling.
        paused:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Paused
          description: When true, no task in this group runs. Downstream tasks execute
            as if the group were not in the pipeline, and each task in it reports
            SUCCEEDED to their conditions.
      additionalProperties: false
      type: object
      required:
      - tasks
      title: TaskGroupModel
      description: 'Defines a group of tasks that execute together within a pipeline.


        Task groups are the primary DAG building block. Dependencies between groups
        create the

        execution graph -- even single tasks should be wrapped in groups. Groups can
        have matrix

        configurations to run multiple iterations with different input values. Group-level

        conditions are combined (ANDed) with task-level conditions.'
    TaskModel:
      properties:
        integration:
          $ref: '#/components/schemas/IntegrationsEnum'
          description: The integration platform (SNOWFLAKE, DBT, AWS_ECS, etc.).
        integrationJob:
          $ref: '#/components/schemas/IntegrationJobsEnum'
          description: The operation to perform. Must be compatible with the integration.
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
          description: Integration specific parameters. Structure depends on integration_job.
        dependsOn:
          items:
            type: string
          type: array
          title: Dependson
          description: IDs of tasks or groups that must complete before this task
            runs. Dependencies are typically set at the task group level to define
            the DAG structure. Use an empty array [] when relying on group-level dependencies.
          default: []
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: 'Expression using ${{ expression }} syntax that determines
            whether this task runs. If combined with a group-level condition, both
            are ANDed together. Examples: status-based "${{ tasks[''task_1''].status
            == ''SUCCEEDED'' }}", input-driven "${{ inputs.flag == True }}", time-based
            "${{ format_date(ORCHESTRA.CURRENT_TIME, ''%d'') == ''01'' }}", output-based
            "${{ ORCHESTRA.PIPELINE_RUN_TASKS[''task_id''].OUTPUTS[''results''] ==
            ''val'' }}".'
        name:
          type: string
          maxLength: 100
          title: Name
          description: Human-readable name for display in UI (max 100 chars).
          default: ''
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Labels for filtering and organization (max 10 tags).
        connection:
          anyOf:
          - $ref: '#/components/schemas/TemplatedConnectionID'
          - type: 'null'
          description: 'Named connection to use for this task''s integration. Format:
            ''name_XXXXX'' pattern with trailing 5-digit suffix (e.g. ''my_snowflake_12345''),
            or a variable expression ''${{ ENV.CONNECTION_NAME }}''.'
        operationMetadata:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/OperationMetadataModel'
            type: object
          - type: 'null'
          title: Operationmetadata
          description: Additional integration configs for lineage tracking.
        treatFailureAsWarning:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Treatfailureaswarning
          description: If true, task failure results in WARNING status instead of
            FAILED.
        configuration:
          anyOf:
          - $ref: '#/components/schemas/ConfigurationModel'
          - type: 'null'
          description: Task-specific retry/timeout settings. Overrides pipeline-level
            configuration.
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
          description: Arbitrary metadata for external tooling.
        alerts:
          anyOf:
          - items:
              $ref: '#/components/schemas/AlertModel'
            type: array
          - type: 'null'
          title: Alerts
          description: Alerts to send when the task completes.
        anomalies:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/TaskDurationAboveBaselineAnomalyModel'
              - $ref: '#/components/schemas/TaskDurationBelowBaselineAnomalyModel'
              - $ref: '#/components/schemas/OperationDurationAboveBaselineAnomalyModel'
              - $ref: '#/components/schemas/OperationDurationBelowBaselineAnomalyModel'
              discriminator:
                propertyName: type
                mapping:
                  operation_duration_above_baseline: '#/components/schemas/OperationDurationAboveBaselineAnomalyModel'
                  operation_duration_below_baseline: '#/components/schemas/OperationDurationBelowBaselineAnomalyModel'
                  task_duration_above_baseline: '#/components/schemas/TaskDurationAboveBaselineAnomalyModel'
                  task_duration_below_baseline: '#/components/schemas/TaskDurationBelowBaselineAnomalyModel'
            type: array
          - type: 'null'
          title: Anomalies
          description: Runtime anomaly monitors for this task run's duration, and
            for the durations of the operations it runs. Operation monitors additionally
            require the dbt model to opt in from its own manifest meta.
        paused:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Paused
          description: When true, this task does not run. Downstream tasks execute
            as if it were not in the pipeline, and it reports SUCCEEDED to their conditions.
      additionalProperties: false
      type: object
      required:
      - integration
      - integrationJob
      - parameters
      title: TaskModel
      description: 'Defines a single task within a pipeline that runs a job on an
        external integration.


        Tasks trigger jobs in external systems (dbt, Snowflake, Fivetran, etc.) and
        handle

        monitoring, metadata, and configuration automatically. Task run states:

        Created -> Queued -> Running -> ((Succeeded | Failed | Skipped) | (Cancelling
        -> Cancelled)).'
