          description: If true, task failure results in WARNING status instead of
            FAILED.
        configuration:
          anyOf:
          - $ref: '#/components/schemas/ConfigurationModel'
          - type: 'null'
          description: Task-specific retry/timeout settings. Overrides pipeline-level
