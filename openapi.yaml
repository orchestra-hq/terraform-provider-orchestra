openapi: 3.1.0
info:
  title: Orchestra API
  description: 'REST API for querying Orchestra run metadata, managing pipelines and
    assets, and retrieving logs and artifacts.


    Only data from the workspace linked to the API key is returned.


    **Note:** Some endpoints are available only to enterprise customers with the Metadata
    API enabled.


    **Data retention:** Metadata list endpoints default to the last 7 days of data.
    The maximum date range per request is 7 days.

    '
  version: v1
  contact:
    name: Orchestra
    url: https://getorchestra.io
servers:
- url: https://app.getorchestra.io/api/engine/public
  description: Production
security:
- BearerAuth: []
tags:
- name: Pipeline Runs
  description: Endpoints for querying, polling, and cancelling pipeline runs
- name: Task Runs
  description: Endpoints for querying task runs
- name: Operations
  description: Endpoints for querying task operations
- name: Assets
  description: Endpoints for querying and managing assets
- name: Asset Dependencies
  description: Endpoints for managing asset lineage dependencies
- name: Pipelines
  description: Endpoints for creating, importing, validating, updating, deleting,
    and starting pipelines
- name: Logs
  description: Endpoints for listing and downloading task run logs
- name: Artifacts
  description: Endpoints for listing and downloading task run artifacts
- name: Compute Resources
  description: Endpoints for compute resource configuration details
paths:
  /pipeline_runs:
    get:
      summary: List pipeline runs
      operationId: listPipelineRuns
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Status
        description: Filter by status. Comma-separated values are supported where
          the parameter accepts multiple values.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
        description: Page number. Must be greater than or equal to 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
        description: Number of items per page. Defaults to 50; maximum 100.
      - name: time_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Time From
          format: date-time
        description: Start of the time window as an ISO 8601 datetime.
      - name: time_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Time To
          format: date-time
        description: End of the time window as an ISO 8601 datetime.
      - name: pipeline_ids
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Pipeline Ids
        description: Filter by pipeline IDs. Provide comma-separated UUIDs for multiple
          values.
      - name: pipeline_run_ids
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Pipeline Run Ids
        description: Filter by pipeline run IDs. Provide comma-separated UUIDs for
          multiple values.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_PipelineRunResponse_'
              example:
                page: 1
                pageSize: 50
                total: 25
                results:
                - id: 286cb489-54f0-499b-b531-b84e3909ac9b
                  pipelineId: c43ca283-6908-4769-a145-a439401f1837
                  pipelineName: My test pipeline
                  accountId: 84e75049-b4c3-4a93-a595-21cff92bdb9d
                  envId: 398945f0-e5ef-4d5a-9698-0b751ad060d0
                  envName: Production
                  runStatus: SUCCEEDED
                  triggeredBy:
                  - triggerType: SENSOR
                    sensorName: Test conditional
                    sensorRunId: 65941b4b-f2d0-405a-ae4b-9d3093165655
                  childPipelineRuns: []
                  message: All tasks have succeeded.
                  createdAt: '2025-05-01T11:16:39.421992+00:00'
                  updatedAt: '2025-05-01T11:17:01.421626+00:00'
                  completedAt: '2025-05-01T11:17:01.280976+00:00'
                  startedAt: '2025-05-01T11:16:44.841252+00:00'
                  branch: main
                  commit: 8cf1f2aea901d8316c694b92bbcfd05ce1e75e5d
                  pipelineVersionNumber: 1
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: "Retrieve a paginated list of [pipeline runs](/docs/core-concepts/pipelines/pipeline-runs)\
        \ for the workspace linked to the API key.\n\n<Note>\n  `time_from` and `time_to`\
        \ are optional. If neither is provided, the API returns the last 7 days of\
        \ data. If both are provided, the maximum time range per request is 7 days.\n\
        </Note>\n\nFilter by multiple statuses, pipeline IDs, or pipeline run IDs\
        \ using comma-separated values. For example, `status=SUCCEEDED,FAILED` returns\
        \ all pipeline runs with either status.\n"
      tags:
      - Pipeline Runs
      security:
      - BearerAuth: []
