      description: 'Defines an input parameter that can be passed when triggering
        a pipeline.


        Inputs allow pipelines to accept dynamic values at runtime, enabling reuse

        with different configurations. Values can be provided via schedule, webhook,

        sensor, or API trigger. Reference input values in tasks using ${{ inputs.<name>
        }}.'
    PipelineModel:
      properties:
        version:
          type: string
          const: v1
          title: Version
          description: Pipeline schema version. Currently only 'v1' is supported.
        name:
          type: string
          maxLength: 100
          title: Name
          description: Unique identifier for this pipeline (max 100 chars). Used in
            UI and API.
        pipeline:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/TaskGroupModel'
            - $ref: '#/components/schemas/TaskModel'
          type: object
          title: Pipeline
          description: Dictionary mapping user-chosen IDs to task group or standalone
            task definitions. IDs must be unique across the entire pipeline and are
            referenced in dependsOn arrays. Task groups (recommended) are the primary
            mechanism for building DAGs -- dependencies between groups define execution
            order.
        schedule:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScheduleModel'
            type: array
          - type: 'null'
          title: Schedule
          description: List of cron schedules that trigger this pipeline. Triggers
            use OR-logic -- any single trigger firing starts a pipeline run.
        sensors:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/SensorModel'
            type: object
          - type: 'null'
          title: Sensors
          description: Dictionary of sensor definitions that trigger this pipeline.
            Triggers use OR-logic -- any single trigger firing starts a pipeline run.
        triggerEvents:
          anyOf:
          - items:
              $ref: '#/components/schemas/TriggerEventModel'
            type: array
          - type: 'null'
          title: Triggerevents
          description: List of pipeline completion events that trigger this pipeline.
            Triggers use OR-logic -- any single trigger firing starts a pipeline run.
        webhook:
          $ref: '#/components/schemas/WebhookModel'
          description: Webhook configuration for manual/API triggers. Triggers use
            OR-logic -- any single trigger firing starts a pipeline run.
          default:
            enabled: false
        configuration:
          anyOf:
          - $ref: '#/components/schemas/ConfigurationModel'
          - type: 'null'
          description: Default retry/timeout settings inherited by all tasks. Task-level
            configuration overrides these pipeline-level defaults.
        inputs:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PipelineInputModel'
            type: object
          - type: 'null'
          title: Inputs
          description: Declared inputs that can be passed when triggering the pipeline.
            Reference in tasks using ${{ inputs.<name> }}. Non-optional inputs without
            defaults must appear in all trigger runInputs.
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        alerts:
          anyOf:
          - items:
              $ref: '#/components/schemas/AlertModel'
            type: array
          - type: 'null'
          title: Alerts
        anomalies:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/PipelineDurationAboveBaselineAnomalyModel'
              - $ref: '#/components/schemas/PipelineDurationBelowBaselineAnomalyModel'
              discriminator:
                propertyName: type
                mapping:
                  pipeline_duration_above_baseline: '#/components/schemas/PipelineDurationAboveBaselineAnomalyModel'
                  pipeline_duration_below_baseline: '#/components/schemas/PipelineDurationBelowBaselineAnomalyModel'
            type: array
          - type: 'null'
          title: Anomalies
      additionalProperties: false
      type: object
      required:
      - version
      - name
      - pipeline
      title: PipelineModel
      description: 'Root model for Orchestra pipeline definitions.


        Orchestra pipelines are DAGs (directed acyclic graphs) of task groups that
        orchestrate jobs

        across external systems (dbt, Snowflake, Fivetran, Databricks, AWS, GCP, Azure,
        etc.).


        DAG structure: The ''pipeline'' dictionary contains task groups (recommended)
        or standalone tasks.

        Each entry has a user-chosen ID that can be referenced in ''dependsOn'' arrays.
        Task groups are

        the primary mechanism for building DAGs -- dependencies between groups define
        execution order.


        Variable system: Use ${{ expression }} syntax throughout the pipeline. Available
        variable types:

        - ENV.*: Environment variables (e.g., ${{ ENV.MY_VAR }})

        - ORCHESTRA.*: Global runtime variables -- PIPELINE_RUN_ID, CURRENT_TIME,
        TASK_RUN_ID

        - inputs.*: Runtime inputs (e.g., ${{ inputs.my_input }})

        - matrix.*: Matrix iteration values (e.g., ${{ matrix.table_name }})

        - ORCHESTRA.PIPELINE_RUN_TASKS[''task_id''].OUTPUTS[''name'']: Upstream task
        outputs

        Built-in functions: format_date(timestamp, format, timezone), add_days(timestamp,
        delta), add_months(timestamp, delta),

        len(list), int(value), str(value).


        Trigger model: Triggers use OR-logic -- any single trigger firing (cron schedule,
        webhook,

        pipeline event, or sensor) starts a pipeline run.


        Pipeline run states:

        Created -> Running -> Succeeded | Failed | Warning | Cancelling -> Cancelled.

        Task run states:

        Created -> Queued -> Running -> Succeeded | Failed | Skipped | Cancelling
        -> Cancelled.


        Key constraints: Task IDs must be unique across the entire pipeline. Dependencies
        must not be

        circular. JSON keys use snake_case in YAML but are converted to camelCase
        in the API (except

        in ''parameters'' blocks and ''inputs'').'
