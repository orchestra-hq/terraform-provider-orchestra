      description: Response returned when starting a pipeline.
    TaskGroupModel:
      properties:
        tasks:
          additionalProperties:
            $ref: '#/components/schemas/TaskModel'
          type: object
          title: Tasks
          description: Dictionary of task definitions within this group. Must have
            at least one.
        dependsOn:
          items:
            type: string
          type: array
          title: Dependson
          description: IDs of other top-level pipeline entries (group or standalone
            task IDs) that must complete before any task in this group runs. This
            is how the DAG is constructed -- dependencies between groups define execution
            order.
          default: []
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: 'Expression using ${{ expression }} syntax applied to ALL tasks
            in the group. Combined with task-level conditions via AND. Example: "${{
            tasks[''upstream_task''].status == ''SUCCEEDED'' }}".'
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
          description: Human-readable name for the group (max 100 chars).
          default: ''
        matrix:
          anyOf:
          - $ref: '#/components/schemas/MatrixBlockModel'
          - type: 'null'
          description: Matrix configuration for running the group multiple times with
            varying inputs. Reference values in tasks via ${{ matrix.<input_name>
            }}. Each value spawns a parallel child iteration of the entire task group.
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
          description: Arbitrary metadata for external tooling.
      additionalProperties: false
      type: object
      required:
      - tasks
      title: TaskGroupModel
      description: 'Defines a group of tasks that execute together within a pipeline.


        Task groups are the primary DAG building block. Dependencies between groups
        create the

        execution graph -- even single tasks should be wrapped in groups. Groups can
        have matrix

        configurations to run multiple iterations with different input values. Group-level

        conditions are combined (ANDed) with task-level conditions.'
    TaskModel:
      properties:
        integration:
          $ref: '#/components/schemas/IntegrationsEnum'
          description: The integration platform (SNOWFLAKE, DBT, AWS_ECS, etc.).
        integrationJob:
          $ref: '#/components/schemas/IntegrationJobsEnum'
          description: The operation to perform. Must be compatible with the integration.
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
          description: Integration specific parameters. Structure depends on integration_job.
        dependsOn:
          items:
            type: string
          type: array
          title: Dependson
          description: IDs of tasks or groups that must complete before this task
            runs. Dependencies are typically set at the task group level to define
            the DAG structure. Use an empty array [] when relying on group-level dependencies.
          default: []
        condition:
          anyOf:
          - type: string
          - type: 'null'
          title: Condition
          description: 'Expression using ${{ expression }} syntax that determines
            whether this task runs. If combined with a group-level condition, both
            are ANDed together. Examples: status-based "${{ tasks[''task_1''].status
            == ''SUCCEEDED'' }}", input-driven "${{ inputs.flag == True }}", time-based
            "${{ format_date(ORCHESTRA.CURRENT_TIME, ''%d'') == ''01'' }}", output-based
            "${{ ORCHESTRA.PIPELINE_RUN_TASKS[''task_id''].OUTPUTS[''results''] ==
            ''val'' }}".'
        name:
          type: string
          maxLength: 100
          title: Name
          description: Human-readable name for display in UI (max 100 chars).
          default: ''
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Labels for filtering and organization (max 10 tags).
        connection:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection
          description: 'Named connection to use for this task''s integration. Format:
            ''name_XXXXX'' pattern with trailing 5-digit suffix (e.g. ''my_snowflake_12345''),
            or a variable expression ''${{ ENV.CONNECTION_NAME }}''.'
        operationMetadata:
          anyOf:
