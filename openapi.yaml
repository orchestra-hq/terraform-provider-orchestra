          description: Maximum concurrent matrix iterations.
        sequential:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sequential
          description: If true, run iterations sequentially instead of in parallel.
        continueOnError:
          anyOf:
          - type: boolean
          - type: 'null'
