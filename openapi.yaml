openapi: 3.1.0
info:
  title: Orchestra API
  description: 'REST API for querying Orchestra run metadata, managing pipelines and
    assets, and retrieving logs and artifacts.


    Requests act on the workspace linked to the API key, or on a workspace that an
    OAuth access token covers.


    **Note:** Some endpoints are available only to enterprise customers with the Metadata
    API enabled.


    **Data retention:** Metadata list endpoints default to the last 7 days of data.
    The maximum date range per request is 7 days.

    '
  version: v1
  contact:
    name: Orchestra
    url: https://getorchestra.io
paths:
  /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/artifacts:
    get:
      tags:
      - Artifacts
      summary: List task run artifacts
      description: List artifacts linked to a task run, such as dbt `manifest.json`,
        `run_results.json`, `catalog.json`, `semantic_manifest.json`, and `sources.json`
        files. For dbt v2, `dbt docs generate` produces `index.html`, `assets.zip`,
        and `info_schema.zip` instead of `catalog.json`.
      parameters:
      - name: pipeline_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Pipeline Run Id
        description: Pipeline run ID.
      - name: task_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Task Run Id
        description: Task run ID.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunArtifactsResponse'
              example:
                filenames:
                - manifest.json
                - run_results.json
                - catalog.json
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-orchestra-mcp: true
  /pipeline_runs/{pipeline_run_id}/task_runs/{task_run_id}/artifacts/download:
    get:
      tags:
      - Artifacts
      summary: Download a task run artifact
      description: 'Stream the contents of a task run artifact file.


        Use the `Range` HTTP header for partial downloads. For example, `Range: bytes=0-262143`
        downloads only the first 256kB of a large artifact such as a dbt manifest.json.'
      parameters:
      - name: pipeline_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Pipeline Run Id
        description: Pipeline run ID.
      - name: task_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Task Run Id
        description: Task run ID.
      - name: filename
        in: query
        required: true
        schema:
          type: string
          maxLength: 945
          title: Filename
        description: Filename returned by the corresponding list endpoint.
      - name: range
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Range
        description: HTTP Range header for partial downloads, for example `bytes=0-262143`.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      responses:
        '200':
          description: Successful response.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-orchestra-mcp: true
  /assets/dependencies:
    post:
      tags:
      - Asset Dependencies
      summary: Create asset dependencies
      description: 'Create directed lineage edges between existing assets.


        Each dependency identifies an upstream asset (`fromId`) and downstream asset
        (`toId`) using external IDs. A single request can create up to 100 dependency
        edges.'
      parameters:
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetDependenciesRequest'
        required: true
      responses:
        '201':
          description: Resource created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssetDependenciesResponse'
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - ApiKey: []
      - OAuth:
        - orchestra:write
  /assets:
    get:
      tags:
      - Assets
      summary: List assets
      description: 'Retrieve a paginated list of assets for the workspace the credential
        resolves to.


        Assets can be filtered by type, integration, integration account, workspace,
        database, schema, status, or asset ID. By default, results are sorted by `created_in_integration`
        in descending order.'
      parameters:
      - name: asset_type
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Asset Type
        description: Filter by asset type. Comma-separated values are supported.
      - name: integration
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/IntegrationsEnum'
          - type: 'null'
          title: Integration
        description: Integration identifier.
      - name: integration_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Integration Account Id
        description: Filter by the account identifier in the integration.
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
        description: Filter by integration workspace ID.
      - name: database_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Database Name
        description: Filter by database name.
      - name: schema_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Name
        description: Filter by schema name.
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Status
        description: Filter by status. Comma-separated values are supported where
          the parameter accepts multiple values.
      - name: asset_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Ids
        description: Filter by asset IDs. Provide comma-separated UUIDs for multiple
          values.
      - name: sort_column
        in: query
        required: false
        schema:
          enum:
          - asset_name
          - asset_type
          - status
          - integration
          - created_in_integration
          - last_updated_in_integration
          type: string
          default: created_in_integration
          title: Sort Column
        description: Column used to sort assets.
      - name: sort_direction
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
          title: Sort Direction
        description: Sort direction.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
        description: Page number. Must be greater than or equal to 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
        description: Number of items per page. Defaults to 50; maximum 100.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AssetResponse_'
              example:
                page: 1
                pageSize: 50
                total: 3
                results:
                - assetId: e7ab37eb-f9aa-4f7d-bda5-e1dd6f7ff61f
                  integration: SIGMA
                  accountId: ceabfd1b-1234-56aa-9781-010b018873874
                  assetName: WB2
                  assetType: WORKBOOK
                  integrationAccountId: bi-production
                  externalId: bi-production.2ba2fac9-bdb7-4384-b3fd-29cce0277806
                  connection: sigma____snowflake_27313
                  status: UNKNOWN
                  createdAt: '2025-10-30T11:45:22.923652+00:00'
                  updatedAt: '2025-10-30T17:07:19.001631+00:00'
                  connectionIntegration: SIGMA
                  upstreamDependencies:
                  - ABCDEFR-RT34234.OPENAI_PLAYGROUND.PUBLIC.MY_TABLE
                  downstreamDependencies: []
                - assetId: ae84c3aa-a459-4ba9-8f95-c0ae01a2bf28
                  integration: SNOWFLAKE
                  accountId: ceabfd1b-1234-56aa-9781-010b018873874
                  assetName: USERS_2
                  assetType: TABLE
                  integrationAccountId: ABCDEFR-RT34234
                  databaseName: OPENAI_PLAYGROUND
                  schemaName: PUBLIC
                  externalId: ABCDEFR-RT34234.OPENAI_PLAYGROUND.PUBLIC.USERS_2
                  connection: snowflake_27313
                  status: HEALTHY
                  createdAt: '2025-10-16T16:39:57.030363+00:00'
                  updatedAt: '2025-11-09T21:33:14.592321+00:00'
                  connectionIntegration: SNOWFLAKE
                  upstreamDependencies:
                  - ABCDEFR-RT34234.OPENAI_PLAYGROUND.PUBLIC.USERS
                  downstreamDependencies: []
                  integrationAssetType: BASE TABLE
                  owner: PYTHON_CONNECTOR_ROLE
                  owners:
                  - PYTHON_CONNECTOR_ROLE
                  createdInIntegration: '2025-10-30T13:39:02.991000+00:00'
                  lastUpdatedInIntegration: '2025-10-30T13:39:02.991000+00:00'
                  usagePercentage: 0.0
                  tableName: USERS_2
                  rowCount: 3
                  bytes: 3072
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-orchestra-mcp: true
    post:
      tags:
      - Assets
      summary: Create an asset
      description: 'Create a data asset in the workspace the credential resolves to.


        Use this endpoint when an external system needs to register an asset for metadata,
        lineage, and observability workflows. The `externalId` must be unique for
        the workspace.'
      parameters:
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: Resource created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - ApiKey: []
      - OAuth:
        - orchestra:write
  /assets/{asset_id}:
    get:
      tags:
      - Assets
      summary: Get an asset
      description: Retrieve a single asset by Orchestra asset ID or external ID.
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 512
          title: Asset Id
        description: Orchestra asset ID or external ID.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-orchestra-mcp: true
    delete:
      tags:
      - Assets
      summary: Delete an asset
      description: Delete an asset by Orchestra asset ID or external ID. Returns `204
        No Content` on success.
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 512
          title: Asset Id
        description: Orchestra asset ID or external ID.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      responses:
        '204':
          description: Operation completed successfully. Empty response body.
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - ApiKey: []
      - OAuth:
        - orchestra:write
    patch:
      tags:
      - Assets
      summary: Update an asset
      description: Partially update mutable metadata for an asset, selected by Orchestra
        asset ID or external ID.
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 512
          title: Asset Id
        description: Orchestra asset ID or external ID.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAssetRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '422':
          description: Validation failed. Check path parameters, query parameters,
            and JSON request bodies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - ApiKey: []
      - OAuth:
        - orchestra:write
  /audit_events:
    get:
      tags:
      - Audit
      summary: List audit events
      description: 'List the audit trail for the workspace the credential resolves
        to, newest first: who did what, to which resource, and what changed.


        `occurred_after` is required and sets how far back the trail is read; every
        other filter narrows within that window.'
      parameters:
      - name: occurred_after
        in: query
        required: true
        schema:
          type: string
          title: Occurred After
        description: Only events at or after this time, as an ISO 8601 timestamp (e.g.
          2026-09-01T00:00:00Z). Required.
      - name: occurred_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Occurred Before
        description: Only events at or before this time, as an ISO 8601 timestamp.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Page Size
        description: Number of items per page. Defaults to 25; maximum 100.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
        description: Page number. Must be greater than or equal to 1.
      - name: actor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        description: Only events performed by this actor, matched on the recorded
          actor id.
      - name: action
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Action
        description: 'Filter by action. Comma-separated values are supported. One
          of: ACCOUNT_CREATED, ACCOUNT_DELETED, ACCOUNT_SETTINGS_UPDATED, ACCOUNT_UPDATED,
          AGENT_CREATED, AGENT_DELETED, AGENT_SESSION_DELETED, AGENT_SESSION_UPDATED,
          AGENT_UPDATED, API_KEY_ROTATED, ASSET_CREATED, ASSET_DELETED, ASSET_DEPENDENCIES_CREATED,
          ASSET_UPDATED, ENVIRONMENT_CREATED, ENVIRONMENT_DELETED, ENVIRONMENT_UPDATED,
          GIT_CONNECTION_CREATED, GIT_CONNECTION_DELETED, GIT_CONNECTION_UPDATED,
          GROUP_CREATED, GROUP_DELETED, GROUP_UPDATED, INCIDENT_MERGED, INCIDENT_STATUS_UPDATED,
          INCIDENT_UNMERGED, INCIDENT_UPDATED, INTEGRATION_CONNECTION_CREATED, INTEGRATION_CONNECTION_DELETED,
          INTEGRATION_CONNECTION_UPDATED, INTEGRATION_CONNECTION_VALIDATED, INTEGRATION_STATE_UPDATED,
          INVITE_SENT, IP_RESTRICTIONS_UPDATED, LOGIN_GOOGLE, LOGIN_KEYCLOAK, LOGIN_MICROSOFT,
          LOGIN_OKTA, LOGIN_PASSWORD, MONITOR_CREATED, MONITOR_DELETED, MONITOR_UPDATED,
          MONITORS_REORDERED, ORGANISATION_SETTINGS_UPDATED, PIPELINE_CREATED, PIPELINE_DELETED,
          PIPELINE_IMPORTED, PIPELINE_PAUSED, PIPELINE_RUN_CANCELLED, PIPELINE_RUN_RESTARTED,
          PIPELINE_STARTED, PIPELINE_UPDATED, PRODUCT_CREATED, PRODUCT_DELETED, PRODUCT_UPDATED,
          SKILL_CREATED, SKILL_DELETED, SKILL_IMPORTED, SKILL_UPDATED, TASK_RUN_OUTPUT_SET,
          USER_ADDED_TO_ACCOUNT, USER_ADDED_TO_GROUP, USER_CREATED, USER_DEACTIVATED,
          USER_MIGRATED, USER_REACTIVATED, USER_REMOVED_FROM_GROUP, USER_UPDATED.'
      - name: resource_type
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Resource Type
        description: 'Filter by the type of resource acted on. Comma-separated values
          are supported. One of: ACCOUNT, AGENT, AGENT_SESSION, API_KEY, ASSET, ENVIRONMENT,
          GIT_CONNECTION, GROUP, INCIDENT, INTEGRATION_CONNECTION, INTEGRATION_STATE,
          INVITE, IP_RESTRICTIONS, MONITOR, ORGANISATION, PIPELINE, PIPELINE_RUN,
          PRODUCT, SKILL, TASK_RUN, USER.'
      - name: resource_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        description: Only events on this resource, by its id or YAML name.
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_AuditEventResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-orchestra-mcp: true
  /compute_resources/azure/federated_credentials:
    get:
      tags:
      - Compute Resources
      summary: Get Azure federated credentials
      description: 'Retrieve the `subject_id` and `audience` values needed for manual
        configuration of Azure app registration federated credentials for Azure hybrid
        compute.


        Use this endpoint when you manage the Azure Enterprise Application and federated
        credentials outside Terraform. If Terraform manages the full deployment, Orchestra
        configures these values automatically.


        The response is workspace-specific. Fetch credentials separately for each
        Orchestra workspace where you run Azure hybrid compute.'
      parameters:
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
          to. Omit it to use the credential's own account. An API key is issued to
          a single account, so it may only name that account; an OAuth token may name
          any account its grant covers.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureFederatedCredentialsResponse'
              example:
                subject_id: eu-west-2:a1b2c3d4-5678-90ab-cdef-EXAMPLE11111
                audience: eu-west-2:a1b2c3d4-5678-90ab-cdef-EXAMPLE22222
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /environments:
    get:
      tags:
      - Environments
      summary: List environments
      description: List the environments for the workspace the credential resolves
        to. Returns environment metadata only — fetch a single environment by ID to
        retrieve its variable values.
      parameters:
      - name: X-Orchestra-Account-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: X-Orchestra-Account-Id
        description: Act on this account rather than the one the credential resolves
