      title: PipelineInputModel
      description: 'Defines an input parameter that can be passed when triggering
        a pipeline.


        Inputs allow pipelines to accept dynamic values at runtime, enabling reuse

        with different configurations. Values can be provided via schedule, webhook,

        sensor, or API trigger. Reference input values in tasks using ${{ inputs.<name>
        }}.'
    PipelineModel:
      properties:
        version:
          type: string
          const: v1
          title: Version
          description: Pipeline schema version. Currently only 'v1' is supported.
        name:
          type: string
          maxLength: 100
          title: Name
          description: Unique identifier for this pipeline (max 100 chars). Used in
            UI and API.
        pipeline:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/TaskGroupModel'
            - $ref: '#/components/schemas/TaskModel'
          type: object
          title: Pipeline
          description: Dictionary mapping user-chosen IDs to task group or standalone
            task definitions. IDs must be unique across the entire pipeline and are
            referenced in dependsOn arrays. Task groups (recommended) are the primary
            mechanism for building DAGs -- dependencies between groups define execution
            order.
        schedule:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScheduleModel'
            type: array
          - type: 'null'
          title: Schedule
          description: List of cron schedules that trigger this pipeline. Triggers
            use OR-logic -- any single trigger firing starts a pipeline run.
        sensors:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/SensorModel'
            type: object
          - type: 'null'
          title: Sensors
          description: Dictionary of sensor definitions that trigger this pipeline.
